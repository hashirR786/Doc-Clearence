name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Moving to a custom domain is ONE repository variable, no code change:
      # Settings -> Secrets and variables -> Actions -> Variables ->
      #   CUSTOM_DOMAIN = www.example.ae
      #
      # With it set, the site builds for the domain root and a CNAME file is
      # written. Without it, it builds for the project page sub-path.
      - name: Resolve deployment target
        id: target
        run: |
          DOMAIN="${{ vars.CUSTOM_DOMAIN }}"
          if [ -n "$DOMAIN" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "url=https://$DOMAIN" >> "$GITHUB_OUTPUT"
          else
            echo "base=/Doc-Clearence" >> "$GITHUB_OUTPUT"
            echo "url=https://hashirr786.github.io/Doc-Clearence" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.target.outputs.base }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.target.outputs.url }}
          # A hosted form endpoint (Formspree), since Pages cannot run /api.
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
        run: npm run build

      # Stops GitHub skipping the _next directory as a Jekyll partial.
      - run: touch out/.nojekyll

      - name: Write CNAME for the custom domain
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > out/CNAME

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
